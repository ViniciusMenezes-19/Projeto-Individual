<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servindo Vidas | Seu Perfil</title>
    <link rel="stylesheet" href="../css/Mudar_perfil.css" />
    <link rel="icon" href="imagens/logo site.png" />
    <script src="../js/sessao.js"></script>
  </head>

  <body onload="validarSessao()">
    <div class="pagina">
      <!-- Navbar lateral -->
      <div class="janela">
        <div class="navbar">
          <h1>Olá, <br /><span id="b_usuario" style="color: #c9a800;"></span></h1>
          <div class="btn-nav">
            <a href="../quizz.html"><h3>Quiz</h3></a>
          </div>
          <div class="btn-nav">
            <a href="../dashboard.html"><h3 style="padding: 5px;">Progresso</h3></a>
          </div>
          <div class="btn-logout" onclick="limparSessao()">
            <h3><a href="../login.html">Sair</a></h3>
          </div>
        </div>
      </div>

      <!-- Conteúdo ao lado da navbar -->
      <div class="conteudo">
        <div class="form-container">
                <label>Nome:
                <input type="text" placeholder="Digite seu novo apelido" id="nome_input"></label>
                <label>Email:
                <input type="email" placeholder="Digite seu novo email" id="email_input"></label>
                <label>Senha:
                <input type="password" placeholder="Digite sua nova senha" id="senha_input"></label>
                <button onclick="atualizarPerfil()">SALVAR ALTERAÇÕES</button>
                <div id="mensagem_erro" class="mensagem_final" style="display: none;"></div>
        </div>
    </div>
    </div>
  </body>
</html>

<script>
  function atualizarPerfil(){
    let novoNome = nome_input.value;
    let novaSenha = senha_input.value;
    let novoEmail = email_input.value 

    if(novoNome == `` || novaSenha == `` || novoEmail == ``){
      mensagem_erro.innerHTML = `Por favor preencha todos os campos!`
      document.getElementById('mensagem_erro').style.display = "flex";
    }
    else{
      mensagem_erro.innerHTML = `Informações salvas com sucesso!`
      document.getElementById('mensagem_erro').style.display = "flex";
      document.getElementById('mensagem_erro').style.color = "green";

      fetch("/editar/atualizar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nomeServer: novoNome,
            senhaServer: novaSenha,
            emailServer: novoEmail,
            idServer: sessionStorage.ID_USUARIO
          }),
        })
          .then(function (resposta) {
            return resposta.json();
          })
          .then(function (resultado) {
            console.log("Dados atualizados com sucesso", resultado);
          })
          .catch(function (erro) {
            console.log("Erro ao atulizar seus dados", erro);
          });

    }
  }
</script>
