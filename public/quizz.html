  <body onload="validarSessao()">
    <div class="pagina">
      <!-- Navbar lateral -->
      <div class="janela">

          <h1>Olá, <br /><span id="b_usuario" style="color: #c9a800;"></span></h1>
          <div class="btn-nav">
            <a href="#"><h3>Quiz</h3></a>

          <div class="btn-nav">

      <!-- Conteúdo ao lado da navbar -->
