<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jornada de Fé | Dashboard</title>
    <link rel="icon" href="imagens/logo site.png" />
    <script src="./js/sessao.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>

  <body
    onload="
      validarSessao();
      carregarDashboard();
    "
  >
    <div class="pagina">
      <div class="janela">
        <div class="navbar">
          <h1>
            Olá, <br /><span id="b_usuario" style="color: #ffffff"></span>
          </h1>
          <div class="btn-nav">
            <a href="quizz.html"><h3>Quiz</h3></a>
          </div>
          <div class="btn-nav">
            <a href="./dashboard/Mudar_perfil.html"><h3>Editar perfil</h3></a>
          </div>
          <div class="btn-logout" onclick="limparSessao()">
            <h3><a href="login.html">Sair</a></h3>
          </div>
        </div>
      </div>

      <div class="conteudo-direita">
        <h2>Métricas</h2>

        <div class="kpis">
          <div class="kpi">
            <h4>Maior Pontuação Sobre: "História do Autor"</h4>
            <span id="kpi-pontuacao-autor" style="color: blue"
              >carregando...</span
            >
          </div>
          <div class="kpi">
            <h4>Menor Pontuação Sobre: "História do Autor"</h4>
            <span id="kpi-menor-pontuacao-autor" style="color: yellow"
              >carregando...</span
            >
          </div>
          <div class="kpi">
            <h4>Maior Pontuação Sobre: "O Batismo"</h4>
            <span id="kpi-pontuacao-batismo" style="color: green"
              >carregando...</span
            >
          </div>
          <div class="kpi">
            <h4>Menor Pontuação Sobre: "O Batismo"</h4>
            <span id="kpi-menor-pontuacao-batismo" style="color: red"
              >carregando...</span
            >
          </div>
        </div>

        <br /><br />

        <div class="titulo">
          <h2>Detalhes da tentativa:</h2>
        </div>

        <div class="grafico">
          <div style="width: 90%">
            <canvas id="graficoPontuacoes"></canvas>
          </div>
        </div>
      </div>
    </div>
  </body>

  <script>
    function carregarDashboard() {
      let idUsuario = sessionStorage.ID_USUARIO;

      fetch(`/dashboard/dados/${idUsuario}`)
        .then(function (resposta) {
          if (resposta.ok) {
            return resposta.json();
          } else {
            throw "Nenhum dado encontrado para este usuário.";
          }
        })
        .then(function (dados) {
          console.log("Dados da dashboard recebidos:", dados);

          if (dados.maior_pontuacao_autor != null) {
            document.getElementById("kpi-pontuacao-autor").innerHTML =
              dados.maior_pontuacao_autor + "/10";
          } else {
            document.getElementById("kpi-pontuacao-autor").innerHTML =
              "Sem tentativas";
          }

          if (dados.menor_pontuacao_autor != null) {
            document.getElementById("kpi-menor-pontuacao-autor").innerHTML = dados.menor_pontuacao_autor + "/10";
          }
          else{
            document.getElementById("kpi-menor-pontuacao-autor").innerHTML = "Sem tentativas";
          }

          if(dados.maior_pontuacao_batismo != null){
            document.getElementById("kpi-pontuacao-batismo").innerHTML = dados.maior_pontuacao_batismo + "/10";
          }
          else{
            document.getElementById("kpi-pontuacao-batismo").innerHTML = "Sem tentativas";
          }

          if(dados.menor_pontuacao_batismo != null){
            document.getElementById("kpi-menor-pontuacao-batismo").innerHTML = dados.menor_pontuacao_batismo + "/10";
          }
          else{
            document.getElementById("kpi-menor-pontuacao-batismo").innerHTML = "Sem tentativas"
          }
          plotarGrafico(dados);
        })
        .catch(function (erro) {
          console.log("Erro ao carregar dashboard:", erro);
        });
    }

    function plotarGrafico(dados) {
      new Chart(document.getElementById("graficoPontuacoes"), {
        type: "bar",
        data: {
          labels: [
            "Maior Pontuação\n'História do Autor'",
            "Menor Pontuação\n'História do Autor'",
            "Maior Pontuação\n'Sobre o Batismo'",
            "Menor Pontuação\n'Sobre o Batismo'",
          ],
          datasets: [
            {
              data: [
                dados.maior_pontuacao_autor || 0,
                dados.menor_pontuacao_autor || 0,
                dados.maior_pontuacao_batismo || 0,
                dados.menor_pontuacao_batismo || 0,
              ],
              backgroundColor: ["blue", "yellow", "green", "red"],
              borderColor: ["#ffffff", "#ffffff", "#ffffff", "#ffffff"],
              borderWidth: 2,
              borderRadius: 4,
            },
          ],
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
          },
          scales: {
            x: {
              ticks: {
                color: "#ffff",
                font: { size: 13 },
              },
              grid: { color: "rgba(255,255,255,0.05)" },
            },
            y: {
              ticks: { color: "#aaaaaa" },
              grid: { color: "rgba(255,255,255,0.05)" },
              beginAtZero: true,
              max: 10,
            },
          },
        },
      });
    }
  </script>
</html>
