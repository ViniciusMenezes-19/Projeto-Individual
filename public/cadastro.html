<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servindo Vidas</title>
    <link
      rel="shortcut icon"
      href="imagens/logo site.png"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="sobreMim">
    <div class="header">
      <nav class="navbar">
        <div class="container-cabecalho">
          <div class="logo">
            <img src="./imagens/logo-nav.png" alt="Logo Jornada de Fé" />
            <span class="titulo-logo"
              ><a href="index.html">Jornada de Fé</a></span
            >
          </div>
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="sobreMim.html">Sobre Mim</a></li>
            <li><a href="cadastro.html">Cadastrar</a></li>
            <li class="btn-login"><a href="login.html">Login</a></li>
          </ul>
        </div>
      </nav>
    </div>

    <div id="linha-separadora"></div>

 
    <div class="container-cadastro">
      <div class="card-formulario">
        <h1>Crie sua conta</h1>
        <p>Preencha os campos abaixo para se cadastrar</p>





        <div class="grupo-campo">
          <span>NOME COMPLETO</span>
          <input
            value="Rodrigo Garro"
            class="input-campo"
            type="text"
            id="input_nome"
            placeholder="Digite seu nome completo"
          />
        </div>



        <div class="grupo-campo">
          <span>E-MAIL</span>
          <input
            value="rodrigogarro@corinthians.com"
            class="input-campo"
            type="email"
            id="input_email"
            placeholder="Digite seu e-mail"
          />
        </div>



        <div class="grupo-campo">
          <span>SENHA</span>
          <input
            value="Garro8@"
            class="input-campo"
            type="password"
            id="input_senha"
            placeholder="Crie sua senha"
          />
        </div>



        <div class="grupo-campo">
          <span>REPETIR SENHA</span>
          <input
            value="Garro8@"
            class="input-campo"
            type="password"
            id="input_confirmarSenha"
            placeholder="Repita a sua senha"
          />
        </div>



        <button id="botaoCadastro" onclick="cadastrar()">CADASTRAR</button>


        <div class="link-login">
          <span>Já tem uma conta?</span> <a href="./login.html">Faça login</a>
        </div>
        <div id="mensagem_erro"></div>
      </div>
    </div>
    <div id="linha-separadora"></div>



    <footer>
      <div class="rodape">
        <p>
          © 2026 SPTECH | Vinícius Menezes - Projeto individual. Todos os
          direitos reservados
        </p>
      </div>
    </footer>

  </body>
</html>

<script>
  function cadastrar() {
    let nome = input_nome.value;
    let email = input_email.value;
    let senha = input_senha.value;
    let confirmarSenha = input_confirmarSenha.value;

    if (nome == "" || email == "" || senha == "" || confirmarSenha == "") {
      mensagem_erro.innerHTML = `Por favor preencha todos os campos`;
    } 
    else if(!email.includes('@')){
      mensagem_erro.innerHTML = `Por favor insira um email válido que inclua '@'`
    }
    else if (senha != confirmarSenha) {
      mensagem_erro.innerHTML = `As senhas não coincidem`;
    } else if (
      !senha.includes("!") &&
      !senha.includes("@") &&
      !senha.includes("#") &&
      !senha.includes("$") && 
      !senha.includes("%") &&
      !senha.includes("&") &&
      !senha.includes("*")
    ) {
      mensagem_erro.innerHTML = `<b> Senha Inválida. </b> <br> Necessário no mínimo um caractere especial. `;
    } else {
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          nomeServer: nome,
          emailServer: email,
          senhaServer: senha,
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            mensagem_erro.innerHTML =
              "Cadastro realizado com sucesso! Redirecionando para tela de Login...";
            setTimeout(() => {
              window.location = "/login.html";
            }, "2000");
          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });
    }
  }
</script>
