<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servindo Vidas</title>
    <link
      rel="shortcut icon"
      href="imagens/logo site.png"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body class="sobreMim">
    <!-- inicio do da minha header/ menu de navegação-->
    <div class="header">
      <nav class="navbar">
        <div class="container-cabecalho">
          <div class="logo">
            <img src="./imagens/logo-nav.png" alt="Logo Jornada de Fé" />
            <span class="titulo-logo"
              ><a href="index.html">Jornada de Fé</a></span
            >
          </div>
          <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="sobreMim.html">Sobre Mim</a></li>
            <li><a href="cadastro.html">Cadastrar</a></li>
            <li class="btn-login"><a href="login.html">Login</a></li>
          </ul>
        </div>
      </nav>
    </div>

    <div id="linha-separadora"></div>

    <!-- Inicio do conteudo de cadastro-->
    <div class="container-cadastro">
      <div class="card-formulario">
        <h1>Entre na sua conta</h1>
        <p>Preencha os campos abaixo para entrar</p>
        <!-- Termino do conteudo de cadastro-->

        <!-- Inicio dos dados pessoais de cada usuario -->


        <!--Inicio do registro "email"-->
        <div class="grupo-campo">
          <span>E-MAIL</span>
          <input
            class="input-campo"
            type="email"
            id="input_email"
            placeholder="Digite seu e-mail"
            value="Trajanomenezes@yuny.com"
          />
        </div>
        <!--Termino do registro "email"-->

        <!--Inicio do registro "senha"-->
        <div class="grupo-campo">
          <span>SENHA</span>
          <input
            class="input-campo"
            type="password"
            id="input_senha"
            placeholder="Digite sua senha"
            value="123456!@"
          />
        </div>
        <!--Termino do registro "Senha"-->

        <!-- BOTÃO -->
        <button id="botaoCadastro" onclick="entrar()">
          ENTRAR
        </button>

        <!-- Inicio "já possui uma conta" -->
        <div class="link-login">
          <span>Ainda não tem uma conta?</span> <a href="cadastro.html">Cadastrar</a>
        </div>
        <div id="mensagem_erro"></div>
      </div>
    </div>

    <div id="linha-separadora"></div>

    <!--Ínicio do meu rodapé-->
    <footer>
      <div class="rodape">
        <p>© 2026 SPTECH | Vinícius Menezes - Projeto individual. Todos os direitos reservados</p>
      </div>
    </footer>
    <!--Término do meu Rodapé-->

  </body>
</html>

<script>

  function entrar(){
  let email = input_email.value;
  let senha = input_senha.value;

  if(email == `` || senha == ``){
    mensagem_erro.innerHTML = `Por favor preencha todos os campos!`
  }
  else if(!email.includes(`@`)){
    mensagem_erro.innerHTML = `Por favor insira um email válido com "@"`
  }
  else {
      fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          emailServer: email,
          senhaServer: senha,
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);

          if (resposta.ok) {
            resposta.json().then(json=>{
              
              sessionStorage.SENHA_USUARIO = json.senha;
              sessionStorage.NOME_USUARIO =  json.nome;
              sessionStorage.EMAIL_USUARIO = json.email;
              sessionStorage.ID_USUARIO    = json.id;
              
            })
            mensagem_erro.innerHTML =
              "login realizado com sucesso! Redirecionando para tela de perfil do usuário";
            setTimeout(() => {
              window.location = "/Seu_perfil.html";
            }, "2000");
          } else {
             mensagem_erro.innerHTML = `Reveja suas credenciais de acesso!`
            throw "Houve um erro ao tentar realizar o login, Reveja suas credencias de acesso";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });
    }
  
}
</script>
